services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatflow
      POSTGRES_USER: seatflow
      POSTGRES_PASSWORD: seatflow
    ports:
      - "5432:5432"
    volumes:
      - seatflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatflow -d seatflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgres://seatflow:seatflow@db:5432/seatflow?sslmode=disable
      PORT: 8080
      COOKIE_SECURE: "false"
      WEB_DIST: /app/dist
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  seatflow-postgres:
